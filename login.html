<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jetson Hub - Identyfikacja Systemowa</title>
    <style>
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background-image: url('img/strona_startowa_tlo.png');
            background-size: cover; background-position: center;
            font-family: 'Courier New', Courier, monospace; color: #00ffcc; overflow: hidden;
        }
        .top-left-back {
            position: absolute; top: 25px; left: 35px; border: 1px solid #00ffcc;
            color: #00ffcc; padding: 3px 8px; font-size: 9px; font-weight: bold;
            text-decoration: none; display: flex; align-items: center;
            background: rgba(0, 10, 10, 0.85); z-index: 100; cursor: pointer;
        }
        .top-left-back:hover { background: #00ffcc; color: #000; box-shadow: 0 0 8px #00ffcc; }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; z-index: 500;
        }
        .auth-container {
            background: rgba(5, 11, 11, 0.95); border: 2px solid #00ffcc;
            padding: 25px; width: 320px; border-radius: 6px; color: #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.35);
        }
        .auth-container h2 { font-size: 13px; margin-top: 0; text-align: center; border-bottom: 1px dashed rgba(0, 255, 204, 0.4); padding-bottom: 8px; }
        .modal-desc { font-size: 9px; color: #88ffdd; margin-bottom: 15px; text-align: center; }
        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 8px; }
        .input-group input { background: #000; border: 1px solid #00ffcc; color: #00ffcc; padding: 7px; font-size: 10px; outline: none; }
        .field-error { font-size: 8px; color: #ff4444; min-height: 12px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btn { flex: 1; padding: 6px; font-size: 9px; cursor: pointer; font-weight: bold; }
        .modal-btn.confirm { background: #00ffcc; border: 1px solid #00ffcc; color: #000; }
        .modal-btn.cancel { background: transparent; border: 1px solid #ff4444; color: #ff4444; }
        .switch-mode { margin-top: 12px; text-align: center; font-size: 8px; color: #88ffdd; cursor: pointer; text-decoration: underline; }
        .system-notify {
            position: fixed; top: 25px; right: 35px; min-width: 220px;
            background: rgba(0, 10, 10, 0.92); border: 1px solid #00ffcc; border-left: 4px solid #00ffcc;
            color: #00ffcc; font-size: 10px; padding: 10px 14px; z-index: 2000;
            opacity: 0; transform: translateX(20px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
        }
        .system-notify.show { opacity: 1; transform: translateX(0); }
        .system-notify.error { border-color: #ff4444; border-left: 4px solid #ff4444; color: #ff4444; }
    </style>
</head>
<body>

    <a href="#" class="top-left-back" id="back-btn" onclick="handleBack(event)">[ POWRÓT ]</a>

    <div id="system-notify" class="system-notify">
        <span style="font-weight: bold;" id="notify-title">SYSTEM</span>
        <div id="notify-body"></div>
    </div>

    <div class="auth-overlay">
        <div class="auth-container">
            
            <!-- FORMULARZ LOGOWANIA -->
            <div id="login-form">
                <h2>IDENTYFIKACJA SYSTEMOWA</h2>
                <p class="modal-desc">Wprowadź dane dostępu, aby zalogować się do systemu.</p>
                <div class="input-group">
                    <label>ID UŻYTKOWNIKA:</label>
                    <input type="text" id="login-user" placeholder="Wpisz login...">
                </div>
                <div class="input-group">
                    <label>HASŁO:</label>
                    <input type="password" id="login-pass" placeholder="Wpisz hasło...">
                    <span class="field-error" id="login-error"></span>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn confirm" onclick="handleLogin()">ZALOGUJ</button>
                    <button class="modal-btn cancel" onclick="handleBack(event)">ANULUJ</button>
                </div>
                <div class="switch-mode" onclick="switchToRegister()">Nie masz konta? Zarejestruj się</div>
            </div>

            <!-- FORMULARZ REJESTRACJI -->
            <div id="register-form" style="display: none;">
                <h2>REJESTRACJA</h2>
                <p class="modal-desc">Utwórz nowe konto w systemie.</p>
                <div class="input-group">
                    <label>NOWY LOGIN:</label>
                    <input type="text" id="reg-user" placeholder="Wybierz login...">
                </div>
                <div class="input-group">
                    <label>NOWE HASŁO:</label>
                    <input type="password" id="reg-pass" placeholder="Wybierz hasło...">
                    <span class="field-error" id="reg-error"></span>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn confirm" onclick="handleRegister()">ZAREJESTRUJ</button>
                    <button class="modal-btn cancel" onclick="handleBack(event)">ANULUJ</button>
                </div>
                <div class="switch-mode" onclick="switchToLogin()">Masz już konto? Zaloguj się</div>
            </div>

        </div>
    </div>

    <script>
        let notifyTimeout = null;

        // Inteligentny powrót bazujący na zapisanej stronie źródłowej
        function handleBack(e) {
            if (e) e.preventDefault();
            const targetPage = localStorage.getItem('halogen_redirect_after_login') || 'index.html';
            localStorage.removeItem('halogen_redirect_after_login');
            window.location.href = targetPage;
        }

        function showNotify(title, message, isError = false) {
            const box = document.getElementById('system-notify');
            document.getElementById('notify-title').innerText = title;
            document.getElementById('notify-body').innerText = message;
            box.classList.toggle('error', isError);
            box.classList.add('show');
            clearTimeout(notifyTimeout);
            notifyTimeout = setTimeout(() => box.classList.remove('show'), 3200);
        }

        function switchToRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }

        function switchToLogin() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }

        async function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            const errorLabel = document.getElementById('login-error');

            if (!user || !pass) {
                errorLabel.innerText = "Uzupełnij wszystkie pola.";
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    await fetch('/api/session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user: result.user })
                    });
                    
                    localStorage.setItem('halogen_logged_user', result.user);
                    showNotify("ZALOGOWANO", "Witaj, " + result.user.toUpperCase());
                    
                    // Powrót na stronę, z której wyszedł użytkownik (np. soccer.html)
                    setTimeout(() => handleBack(null), 1200);
                } else {
                    errorLabel.innerText = "Błędny login lub hasło!";
                    showNotify("BŁĄD", "Błędny login lub hasło!", true);
                }
            } catch (e) {
                errorLabel.innerText = "Błąd połączenia z serwerem.";
            }
        }

        async function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const errorLabel = document.getElementById('reg-error');

            if (!user || !pass) {
                errorLabel.innerText = "Uzupełnij wszystkie pola.";
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showNotify("KONTO UTWORZONE", "Możesz się teraz zalogować.");
                    switchToLogin();
                    document.getElementById('login-user').value = user;
                } else if (result.message === 'exists') {
                    errorLabel.innerText = "Taki użytkownik już istnieje!";
                } else {
                    errorLabel.innerText = "Błąd rejestracji.";
                }
            } catch (e) {
                errorLabel.innerText = "Błąd połączenia z serwerem.";
            }
        }
    </script>
   
</body>
</html>
