<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jetson Hub - System Halogen AI</title>
    <style>
        body { 
            margin: 0; padding: 0; min-height: 100vh; 
            background-image: url('IMG/strona_startowa_tlo.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            font-family: 'Courier New', Courier, monospace; color: #00ffcc; overflow: hidden; 
        }
        
        .monitor-screen { 
            position: absolute; 
            top: 43%; 
            left: 62.5%; 
            width: 24.8%; 
            height: 18%; 
            transform: rotate(5deg); 
            display: flex; 
            gap: 4px; 
            clip-path: polygon(1.93% 9.98%, 100% 0%, 98.39% 100%, 0% 85.54%); 
            z-index: 50;
        }

        @media (max-width: 768px) {
            .monitor-screen {
                top: 80% !important; 
                left: 15% !important;
                width: 70% !important;
                height: 15% !important;
                transform: none !important; 
                clip-path: none !important;
            }
        }

        .monitor-frame { flex: 1; border: 1px solid rgba(0, 255, 204, 0.5); background: #000; cursor: pointer; }
        .monitor-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .top-left-chat-label { position: absolute; top: 25px; left: 35px; border: 1px solid #00ffcc; color: #00ffcc; padding: 3px 8px; font-size: 9px; font-weight: bold; z-index: 100; cursor: pointer; background: rgba(0, 10, 10, 0.85); text-decoration: none; }
        .system-auth-bar { position: absolute; top: 25px; right: 35px; display: flex; align-items: center; gap: 10px; font-size: 10px; color: #00ffcc; z-index: 100; background: rgba(0, 10, 10, 0.85); padding: 6px 12px; border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 4px; }
    </style>
</head>
<body>

    <a href="#" class="top-left-chat-label">CZAT</a>
    <div class="system-auth-bar">[ KONTO: GUEST ]</div>
    
    <div class="monitor-screen">
        <a href="soccer.html" class="monitor-frame"><img src="IMG/soccer_battle_tlo1.jpg" alt="Soccer"></a>
        <a href="carx.html" class="monitor-frame"><img src="IMG/carx_tlo.jpg" alt="CarX"></a>
    </div>

</body>
</html>
