<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jetson Hub - System Halogen AI</title>
    <style>
        body { 
            margin: 0; padding: 0; min-height: 100vh; 
            background-image: url('IMG/strona_startowa_tlo.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            font-family: 'Courier New', Courier, monospace; color: #00ffcc; overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        .rotate-hint { display: none; }
        @media (max-width: 768px) and (orientation: portrait) {
            body > *:not(.rotate-hint):not(#halogen-chat-container) { display: none !important; }
            .rotate-hint { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; color: #00ffcc; padding: 20px; font-size: 14px; }
        }
        .top-left-chat-label { position: absolute; top: 25px; left: 35px; border: 1px solid #00ffcc; color: #00ffcc; padding: 3px 8px; font-size: 9px; font-weight: bold; border-radius: 2px; z-index: 100; cursor: pointer; background: rgba(0, 10, 10, 0.85); text-decoration: none; }
        .top-left-chat-label:hover { background: #00ffcc; color: #000; }
        .system-auth-bar { position: absolute; top: 25px; right: 35px; display: flex; align-items: center; gap: 10px; font-size: 10px; color: #00ffcc; z-index: 100; background: rgba(0, 10, 10, 0.85); padding: 6px 12px; border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 4px; }
        .status-dot { width: 6px; height: 6px; background-color: #00ffcc; border-radius: 50%; box-shadow: 0 0 4px #00ffcc; }
        .auth-btn, .help-btn, .logout-btn, .lang-btn { background: transparent; border: 1px solid #00ffcc; color: #00ffcc; padding: 3px 8px; font-size: 9px; cursor: pointer; border-radius: 2px; }
        .logout-btn { border-color: #ff4444; color: #ff4444; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #050b0b; border: 2px solid #00ffcc; padding: 25px; width: 320px; border-radius: 6px; }
        
        /* Oryginalne kafelki / ekrany monitorów – domyślnie (desktop) */
        .monitor-screen { 
            position: absolute; 
            top: 43%; 
            left: 62.5%; 
            width: 24.8%; 
            height: 18%; 
            transform: rotate(5deg); 
            display: flex; 
            gap: 4px; 
            clip-path: polygon(1.93% 9.98%, 100% 0%, 98.39% 100%, 0% 85.54%); 
        }

        /* Wersja mobilna: zjeżdżamy mocno w dół z zachowaniem idealnego pochylenia i proporcji */
        @media (max-width: 768px) {
            .monitor-screen {
                top: 78% !important; 
                left: 15% !important;
                width: 70% !important;
                height: 15% !important;
                transform: rotate(5deg) !important;
            }
        }

        .monitor-frame { flex: 1; border: 1px solid rgba(0, 255, 204, 0.5); background: #000; cursor: pointer; position: relative; }
        .monitor-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        #halogen-chat-container {
            display: none; 
            position: fixed; 
            bottom: 10px; 
            right: 10px; 
            width: 420px; 
            height: 450px; 
            background: #0a0a0a; 
            border: 2px solid #00ffcc; 
            z-index: 9999; 
            flex-direction: column;
        }

        @media (max-width: 480px) {
            #halogen-chat-container {
                width: 96vw;
                height: 80vh;
                right: 2vw;
                bottom: 10px;
            }
        }

        .chat-layout { display: flex; flex: 1; overflow: hidden; height: calc(100% - 85px); }
        .users-sidebar { width: 130px; border-right: 1px solid #00ffcc; background: #030606; padding: 5px; overflow-y: auto; font-size: 10px; flex-shrink: 0; }
        .user-item { cursor: pointer; padding: 3px 4px; margin-bottom: 2px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #00ffcc; }
        .user-item:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <div class="rotate-hint">OBRÓĆ URZĄDZENIE, ABY KONTYNUOWAĆ</div>
    <a href="#" class="top-left-chat-label" id="t-chat" onclick="toggleChat(event)">CZAT</a>

    <div class="system-auth-bar">
        <span class="status-dot"></span> <span id="t-status">STATUS:</span>
        <a href="login.html" class="auth-btn" id="login-trigger-btn">[ KONTO: GUEST ]</a>
        <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">[ EN ]</button>
        <button class="help-btn" id="t-help" onclick="openModal('help')">[ POMOC ]</button>
        <button class="logout-btn" id="logout-btn" onclick="handleLogout()" style="display: none;">[ WYLOGUJ ]</button>
    </div>

    <div id="auth-modal" class="modal-overlay" onclick="handleModalOutsideClick(event)">
        <div id="help-form" class="modal-content" style="display: none;">
            <h2 id="t-help-title">WSPARCIE SYSTEMOWE</h2>
            <p id="t-help-desc">Kontakt: Chalecki78@gmail.com</p>
            <button onclick="closeModal()">ZROZUMIAŁEM</button>
        </div>
    </div>

    <div class="monitor-screen">
        <a href="soccer.html" class="monitor-frame"><img src="IMG/soccer_battle_tlo1.jpg" alt="Soccer"></a>
        <a href="carx.html" class="monitor-frame"><img src="IMG/carx_tlo.jpg" alt="CarX"></a>
    </div>

    <!-- OKNO CZATU -->
    <div id="halogen-chat-container">
        <div style="background: #00ffcc; color: #000; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; flex-shrink: 0;">
            <span id="chat-title">HALOGEN CHAT</span>
            <button onclick="toggleChat(event)" style="background: #000; color: #00ffcc; border: 1px solid #000; cursor: pointer; font-weight: bold;">X</button>
        </div>
        
        <div style="padding: 5px; background: #050b0b; border-bottom: 1px solid #00ffcc; display: flex; gap: 5px; align-items: center; flex-shrink: 0;">
            <select id="chat-target" style="flex: 1; background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px; font-family: 'Courier New'; font-size: 11px;">
                <option value="global">Pokój: Globalny</option>
                <option value="techniczny">Pokój: Techniczny</option>
                <option value="pw">Prywatna wiadomość (Szept)</option>
            </select>
            <input type="text" id="recipient-name" placeholder="Nick odbiorcy" style="width: 90px; display: none; background: #000; color: #fff; border: 1px solid #00ffcc; padding: 4px; font-size: 11px;" readonly>
        </div>

        <div class="chat-layout">
            <div class="users-sidebar">
                <div style="font-weight: bold; border-bottom: 1px dashed #00ffcc; margin-bottom: 4px; padding-bottom: 2px; color: #00ffcc;">ONLINE:</div>
                <div id="online-users-list"></div>
            </div>
            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 10px; color: #00ffcc; font-size: 12px; word-break: break-all; background: #050b0b;"></div>
        </div>
        
        <div style="display: flex; padding: 8px; border-top: 1px solid #00ffcc; background: #050b0b; flex-shrink: 0;">
            <input type="text" id="chat-input" placeholder="Wpisz wiadomość..." style="flex: 1; background: #000; border: 1px solid #00ffcc; color: #fff; padding: 6px; font-size: 11px;">
            <button onclick="sendChatMessage()" style="background: #00ffcc; color: #000; border: none; padding: 0 12px; font-weight: bold; cursor: pointer;">OK</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        let socket = null;
        let currentLang = 'PL';
        
        function initChatSocket() {
            if (socket) return;
            socket = io({
                transports: ['polling', 'websocket'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000
            });

            socket.on('connect', () => {
                let currentUser = getCurrentUser();
                socket.emit('register_socket', { user: currentUser });
                socket.emit('join', { room: 'global', user: currentUser });
            });

            socket.on('update_user_list', function(users) {
                const usersListDiv = document.getElementById('online-users-list');
                usersListDiv.innerHTML = '';
                let currentUser = getCurrentUser();
                users.forEach(user => {
                    if (user !== currentUser) {
                        usersListDiv.innerHTML += `<div class="user-item" onclick="startPrivateChat('${user}')" title="Kliknij, aby pisać prywatnie">@ ${user}</div>`;
                    }
                });
            });

            socket.on('status', function(data) {
                const messagesDiv = document.getElementById('chat-messages');
                messagesDiv.innerHTML += `<div style="color: #888; font-style: italic; margin-bottom: 4px;">* ${data.msg}</div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            socket.on('new_message', function(msgData) {
                const messagesDiv = document.getElementById('chat-messages');
                let displaySender = msgData.user;
                let msgStyle = '';
                if (msgData.private) {
                    displaySender = `[PW od ${msgData.user}]`;
                    msgStyle = 'color: #ffcc00;';
                } else if (msgData.room && msgData.room !== 'global') {
                    displaySender = `[${msgData.room}] ${msgData.user}`;
                }
                messagesDiv.innerHTML += `<div style="margin-bottom: 4px; ${msgStyle}"><b>${displaySender}:</b> ${msgData.msg}</div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        window.startPrivateChat = function(username) {
            document.getElementById('chat-target').value = 'pw';
            const recipientInput = document.getElementById('recipient-name');
            recipientInput.style.display = 'block';
            recipientInput.value = username;
            document.getElementById('chat-title').textContent = `HALOGEN CHAT (PW: ${username})`;
            document.getElementById('chat-input').focus();
        };

        function getCurrentUser() {
            let currentUser = localStorage.getItem('halogen_logged_user');
            if (!currentUser || currentUser === '') {
                const loginBtnText = document.getElementById('login-trigger-btn').textContent;
                if (loginBtnText.includes('KONTO:')) {
                    currentUser = loginBtnText.replace('[ KONTO:', '').replace(']', '').trim();
                }
            }
            if (!currentUser || currentUser.includes('GUEST')) {
                return 'GUEST';
            }
            return currentUser;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initChatSocket();
            checkLoginStatus();

            const chatInput = document.getElementById('chat-input');
            if (chatInput) {
                chatInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        sendChatMessage();
                    }
                });
            }

            document.getElementById('chat-target').addEventListener('change', function() {
                const recipientInput = document.getElementById('recipient-name');
                const chatTitle = document.getElementById('chat-title');
                if (this.value === 'pw') {
                    recipientInput.style.display = 'block';
                    recipientInput.focus();
                    chatTitle.textContent = 'HALOGEN CHAT (PW)';
                } else {
                    recipientInput.style.display = 'none';
                    recipientInput.value = '';
                    chatTitle.textContent = `HALOGEN CHAT (${this.value.toUpperCase()})`;
                    if (socket) {
                        socket.emit('join', { room: this.value, user: getCurrentUser() });
                    }
                }
            });
        });

        function toggleChat(event) {
            if (event) event.preventDefault();
            const chatBox = document.getElementById('halogen-chat-container');
            if (chatBox.style.display === 'none' || chatBox.style.display === '') {
                chatBox.style.display = 'flex';
                setTimeout(() => {
                    const input = document.getElementById('chat-input');
                    if (input) input.focus();
                }, 100);
            } else {
                chatBox.style.display = 'none';
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();
            const targetSelect = document.getElementById('chat-target').value;
            const recipientInput = document.getElementById('recipient-name');
            if (messageText !== '') {
                if (!socket) initChatSocket();
                let currentUser = getCurrentUser();
                let payload = { msg: messageText, user: currentUser };
                if (targetSelect === 'pw') {
                    const recipientName = recipientInput.value.trim();
                    if (!recipientName) {
                        alert('Wybierz użytkownika z listy po lewej stronie, aby napisać prywatnie!');
                        return;
                    }
                    payload.recipient = recipientName;
                } else {
                    payload.room = targetSelect;
                    payload.recipient = null;
                }
                socket.emit('chat_msg', payload);
                input.value = '';
                input.focus();
            }
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'PL') ? 'EN' : 'PL';
            document.getElementById('lang-toggle-btn').textContent = `[ ${currentLang} ]`;
        }

        function openModal(type) {
            document.getElementById('auth-modal').style.display = 'flex';
            document.getElementById('help-form').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('help-form').style.display = 'none';
        }

        function handleModalOutsideClick(event) {
            if (event.target.id === 'auth-modal') closeModal();
        }

        function checkLoginStatus() {
            const loggedUser = localStorage.getItem('halogen_logged_user');
            const loginBtn = document.getElementById('login-trigger-btn');
            const logoutBtn = document.getElementById('logout-btn');
            if (loggedUser) {
                loginBtn.textContent = `[ KONTO: ${loggedUser} ]`;
                logoutBtn.style.display = 'inline-block';
            } else {
                loginBtn.textContent = '[ KONTO: GUEST ]';
                logoutBtn.style.display = 'none';
            }
        }

        function handleLogout() {
            localStorage.removeItem('halogen_logged_user');
            checkLoginStatus();
            window.location.reload();
        }
    </script>
</body>
</html>
