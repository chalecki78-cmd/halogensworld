<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoryzacja - Halogen Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #050b0b;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(0, 10, 10, 0.9);
            border: 2px solid #00ffcc;
            padding: 30px;
            width: 320px;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            text-align: center;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed rgba(0, 255, 204, 0.4);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 10px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 8px #00ffcc;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
            background: #00ffcc;
            border: 1px solid #00ffcc;
            color: #000;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .mode-switch {
            margin-top: 15px;
            font-size: 10px;
            cursor: pointer;
            color: #00ffcc;
            background: none;
            border: none;
            text-decoration: underline;
        }

        .mode-switch:hover {
            color: #fff;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            font-size: 9px;
            color: #00ffcc;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #message {
            font-size: 9px;
            margin-top: 10px;
            min-height: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 id="form-title">IDENTYFIKACJA UŻYTKOWNIKA</h2>
        
        <div class="input-group">
            <label>NAZWA UŻYTKOWNIKA:</label>
            <input type="text" id="username" placeholder="Wpisz login...">
        </div>

        <div class="input-group">
            <label>HASŁO:</label>
            <input type="password" id="password" placeholder="Wpisz hasło...">
        </div>

        <div id="message"></div>

        <div class="btn-container">
            <button id="submit-btn" onclick="handleSubmit()">WEJDŹ DO SYSTEMU</button>
        </div>

        <button class="mode-switch" id="switch-btn" onclick="toggleMode()">Nie masz konta? Zarejestruj się</button>

        <a href="index.html" class="back-link">&lt;&lt; POWRÓT DO CENTRUM</a>
    </div>

<script>
    const API_URL = 'https://halogensworld.onrender.com';
    let isRegisterMode = false;

    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        const title = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const switchBtn = document.getElementById('switch-btn');
        const msg = document.getElementById('message');
        
        msg.innerText = '';

        if (isRegisterMode) {
            title.innerText = 'REJESTRACJA NOWEGO KONTA';
            submitBtn.innerText = 'ZAREJESTRUJ SIĘ';
            switchBtn.innerText = 'Masz już konto? Zaloguj się';
        } else {
            title.innerText = 'IDENTYFIKACJA UŻYTKOWNIKA';
            submitBtn.innerText = 'WEJDŹ DO SYSTEMU';
            switchBtn.innerText = 'Nie masz konta? Zarejestruj się';
        }
    }

    async function handleSubmit() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('message');

        if (!user || !pass) {
            msg.style.color = '#ff4444';
            msg.innerText = 'Wypełnij wszystkie pola!';
            return;
        }

        try {
            msg.style.color = '#00ffcc';
            msg.innerText = 'Przetwarzanie...';

            let endpoint = isRegisterMode ? '/api/register' : '/api/login';

            let response = await fetch(`${API_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });

            const data = await response.json();

            if (response.ok) {
                if (isRegisterMode) {
                    msg.style.color = '#00ffcc';
                    msg.innerText = 'Rejestracja pomyślna! Trwa logowanie...';
                    // Po udanej rejestracji logujemy automatycznie
                    setTimeout(async () => {
                        let loginResponse = await fetch(`${API_URL}/api/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user, pass })
                        });
                        let loginData = await loginResponse.json();
                        if (loginResponse.ok) {
                            localStorage.setItem('halogen_logged_user', loginData.user || user);
                            window.location.href = 'index.html';
                        }
                    }, 800);
                } else {
                    localStorage.setItem('halogen_logged_user', data.user || user);
                    msg.style.color = '#00ffcc';
                    msg.innerText = 'Autoryzacja pomyślna! Przekierowanie...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                }
            } else {
                msg.style.color = '#ff4444';
                msg.innerText = data.message || (isRegisterMode ? 'Błąd rejestracji!' : 'Brak takiego użytkownika lub błędne hasło!');
            }
        } catch (e) {
            msg.style.color = '#ff4444';
            msg.innerText = 'Błąd połączenia z serwerem!';
        }
    }
</script>

</body>
</html>
