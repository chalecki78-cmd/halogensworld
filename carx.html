<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarX [W BUDOWIE] - Jetson Hub Halogen AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('img/carx_tlo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            overflow: hidden;
        }

        /* KOMUNIKAT "OBRÓĆ URZĄDZENIE" */
        .rotate-hint {
            display: none;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body > *:not(.rotate-hint) {
                display: none !important;
            }
            .rotate-hint {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                text-align: center;
                color: #00ffcc;
                padding: 20px;
                box-sizing: border-box;
                font-size: 14px;
                line-height: 1.6;
            }
        }

        .top-left-back-label {
            position: absolute;
            top: 25px;
            left: 35px;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 2px;
            text-decoration: none;
            background: rgba(0, 10, 10, 0.85);
            backdrop-filter: blur(2px);
            z-index: 100;
            transition: all 0.2s ease;
        }

        .top-left-back-label:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 8px #00ffcc;
        }

        .content-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 10, 10, 0.92);
            border: 1px solid #00ffcc;
            padding: 35px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            max-width: 480px;
            width: 85%;
        }

        .status-badge {
            display: inline-block;
            border: 1px dashed #ffaa00;
            color: #ffaa00;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: rgba(255, 170, 0, 0.1);
        }

        h1 {
            font-size: 15px;
            margin-top: 0;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(0, 255, 204, 0.4);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        p {
            font-size: 11px;
            line-height: 1.6;
            color: #88ffdd;
            margin-bottom: 25px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-top: 2px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="rotate-hint">
        OBRÓĆ URZĄDZENIE, ABY KONTYNUOWAĆ<br>
        [ ROTATE DEVICE TO CONTINUE ]
    </div>

    <!-- POWRÓT DO HUBA -->
    <a href="index.html" class="top-left-back-label" id="t-back">[ POWRÓT / BACK ]</a>

    <div class="content-container">
        <div class="status-badge" id="t-badge">[ STATUS: W TRAKCIE TWORZENIA ]</div>
        <h1 id="t-title">MODUŁ CARX</h1>
        <p id="t-desc"><span class="spinner"></span>Ta sekcja systemu Halogen AI jest obecnie w fazie programowania i wdrażania. Wkrótce pojawią się tutaj nowe funkcje oraz telemetria.</p>
    </div>

    <script>
        let currentLang = localStorage.getItem('halogen_lang') || 'pl';
        
        const translations = {
            pl: {
                back: "[ POWRÓT ]",
                badge: "[ STATUS: W TRAKCIE TWORZENIA ]",
                title: "MODUŁ CARX",
                desc: "Ta sekcja systemu Halogen AI jest obecnie w fazie programowania i wdrażania. Wkrótce pojawią się tutaj nowe funkcje oraz telemetria."
            },
            en: {
                back: "[ BACK ]",
                badge: "[ STATUS: UNDER CONSTRUCTION ]",
                title: "CARX MODULE",
                desc: "This section of the Halogen AI system is currently under development and deployment. New features and telemetry will appear here soon."
            }
        };

        function applyLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('t-back').innerText = t.back;
            document.getElementById('t-badge').innerText = t.badge;
            document.getElementById('t-title').innerText = t.title;
            
            // Zachowujemy element spinnera przy aktualizacji tekstu opisu
            const descEl = document.getElementById('t-desc');
            descEl.innerHTML = `<span class="spinner"></span>${t.desc}`;
        }

        window.onload = () => {
            applyLanguage(currentLang);
        };
    </script>
</body>
</html>
